# Student and mentor roster, grouped by subteam. "order" controls display order;
# the file content loader does not preserve YAML array order on its own.
#
# Every member starts as a placeholder so the layout is real before the names
# are. Replace `name` with the student's name and set `placeholder: false` once
# the name is confirmed and cleared for publication. Placeholders render with
# the site's unconfirmed-data outline and are counted by the tuning panel, so
# the page cannot ship with an unfilled slot by accident.
#
# Add or remove members freely: the grid reflows at any count.
# `lead: true` marks a student lead. `year` is the graduation year.

- id: "mechanical"
  order: 1
  group: "Mechanical"
  members:
    - { name: "Student lead", lead: true }
    - { name: "Student name" }
    - { name: "Student name" }
    - { name: "Student name" }
    - { name: "Student name" }
    - { name: "Student name" }
    - { name: "Student name" }
    - { name: "Student name" }

