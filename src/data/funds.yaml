# "Where it goes" breakdown, used on both the home page and the sponsors
# page. "order" controls display order; the file content loader does not
# preserve YAML array order on its own.
#
# Amounts are the team's rough estimates, imported from the design prototype.
# They must sum to the "total" entry or the pie chart will not close. They
# are still unconfirmed, which is why the sponsors page carries a "Rough
# estimate, not final" note. See the open issue on verifying these numbers
# and adding an outreach / community events line.
- id: "registration"
  order: 1
  label: "Registration and event fees"
  amount: "$4,000"
  flagged: true
  tag: "estimate"
  total: false
- id: "parts"
  order: 2
  label: "Robot parts and materials"
  amount: "$3,000"
  flagged: true
  tag: "estimate"
  total: false
- id: "travel"
  order: 3
  label: "Travel to competitions"
  amount: "$3,000"
  flagged: true
  tag: "estimate"
  total: false
- id: "total"
  order: 4
  label: "Total"
  amount: "$10,000"
  flagged: false
  tag: ""
  total: true
