# "Where it goes" breakdown, used on both the home page and the sponsors
# page. "order" controls display order; the file content loader does not
# preserve YAML array order on its own.
# Amounts are round numbers; they must sum to the "total" entry or the pie
# chart will not close.
- id: "travel"
  order: 1
  label: "Travel to competitions"
  amount: "$7,000"
  flagged: false
  tag: ""
  total: false
- id: "swerve"
  order: 2
  label: "New swerve drivetrain"
  amount: "$5,500"
  flagged: false
  tag: ""
  total: false
- id: "parts"
  order: 3
  label: "Robot parts and materials"
  amount: "$2,500"
  flagged: false
  tag: ""
  total: false
- id: "total"
  order: 4
  label: "Total"
  amount: "$15,000"
  flagged: false
  tag: ""
  total: true
