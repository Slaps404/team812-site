# Sponsor wall entries. "logo" keys map to the three SVGs in
# src/assets/logos/ (imports are static in LogoWall.astro). "order"
# controls display order; the file content loader does not preserve
# YAML array order on its own.
- id: "qualcomm"
  order: 1
  name: "Qualcomm"
  tier: "current"
  url: "https://www.qualcomm.com/"
  logo: "qualcomm"
  widthClass: "w-qualcomm"
- id: "nordson"
  order: 2
  name: "Nordson"
  tier: "current"
  url: "https://www.nordson.com/"
  logo: "nordson"
  widthClass: "w-nordson"
- id: "leidos"
  order: 3
  name: "Leidos"
  tier: "current"
  url: "https://www.leidos.com/"
  logo: "leidos"
  widthClass: "w-leidos"
- id: "cluely"
  order: 4
  name: "Cluely"
  tier: "past"
  url: "https://cluely.com/"
