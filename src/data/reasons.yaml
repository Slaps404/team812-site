# Numbered reasons on the sponsors page. "order" controls display order;
# the file content loader does not preserve YAML array order on its own.
- id: "01"
  order: 1
  num: "01"
  title: "Your money reaches students with no other route in."
  body: "The Preuss School serves low-income students who will be first in their families to finish college. There is no home workshop and no family engineer. This team is the entire pipeline."
- id: "02"
  order: 2
  num: "02"
  title: "Our work is public and auditable."
  body: 'Sixteen seasons of robot code on <a href="https://github.com/preuss812" target="_blank" rel="noopener" style="color:var(--accent)">GitHub</a>, plus two tools we wrote ourselves. Ask an engineer on your team to look. Most sponsorship requests cannot offer that.'
- id: "03"
  order: 3
  num: "03"
  title: "25 years means we will still be here."
  body: 'San Diego''s first FRC team, competing since 2001, with 51 events and 5 trips to the World Championship. Your logo goes on a program with a record, not a startup.'
