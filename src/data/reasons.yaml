# Numbered reasons on the sponsors page. "order" controls display order;
# the file content loader does not preserve YAML array order on its own.
- id: "01"
  order: 1
  num: "01"
  title: "You are funding a student-run engineering program."
  body: "The Preuss School serves low-income students who will be first in their families to finish college. For many students, Team 812 is their first chance to use engineering tools and work with mentors."
- id: "02"
  order: 2
  num: "02"
  title: "Our robot code is public."
  body: 'Sixteen seasons of robot code are public on <a href="https://github.com/preuss812" target="_blank" rel="noopener" style="color:var(--ink)">GitHub</a>, along with two tools we built ourselves. Engineers can inspect how we build and test.'
- id: "03"
  order: 3
  num: "03"
  title: "We have been building in San Diego since 2001."
  body: 'Team 812 is San Diego''s first FRC team. We have competed in 51 events and made five trips to the World Championship. Your sponsorship helps keep that student-run program going.'
